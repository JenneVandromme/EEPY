name: Camera

# The camera code (eepy/camera/) has to work on every teammate's laptop:
# macOS, Windows and Ubuntu. These runners have no webcam and no robot, so the
# tests use FakeCamera and a relay on 127.0.0.1 -- which still exercises the
# per-OS parts that matter most: threads and timing, sockets, file paths.
on:
  push:
    paths:
      - "eepy/camera/**"
      - "eepy/logs/**"
      - "tests/test_camera.py"
      - "config/eepy.yaml"
      - "requirements-vision.txt"
      - ".github/workflows/camera.yml"
  pull_request:
    paths:
      - "eepy/camera/**"
      - "eepy/logs/**"
      - "tests/test_camera.py"
      - "config/eepy.yaml"
      - "requirements-vision.txt"
      - ".github/workflows/camera.yml"
  workflow_dispatch:

jobs:
  camera:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        # The vision environment is Python 3.9 on some laptops: check it too.
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: windows-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # What the vision environment has, minus mediapipe (not needed here).
      # headless: the runners have no screen.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2" opencv-python-headless pyyaml pytest

      - name: Camera tests (FakeCamera)
        run: python -m pytest tests/test_camera.py -q
