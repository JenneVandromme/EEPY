name: Camera & face features

# The vision side (eepy/camera/, eepy/perception/) has to work on every
# teammate's laptop: macOS, Windows and Ubuntu, on the vision environment's
# Python (3.9 on some laptops, 3.12 on others). These runners have no webcam
# and no robot, so the tests use FakeCamera, a relay on 127.0.0.1 and
# synthetic face signals -- plus one real MediaPipe run on a blank picture,
# which proves the pinned MediaPipe wheel installs and loads on each OS.
on:
  push:
    paths:
      - "eepy/camera/**"
      - "eepy/perception/**"
      - "eepy/logs/**"
      - "eepy/state/**"
      - "tests/test_camera.py"
      - "tests/test_perception.py"
      - "tests/test_aus.py"
      - "tests/test_gaze.py"
      - "tests/test_calibration.py"
      - "tests/test_state.py"
      - "tests/test_hmm.py"
      - "config/eepy.yaml"
      - "config/state_rules.yaml"
      - "config/state_hmm.yaml"
      - "requirements-vision.txt"
      - "requirements-aus.txt"
      - ".github/workflows/camera.yml"
  pull_request:
    paths:
      - "eepy/camera/**"
      - "eepy/perception/**"
      - "eepy/logs/**"
      - "eepy/state/**"
      - "tests/test_camera.py"
      - "tests/test_perception.py"
      - "tests/test_aus.py"
      - "tests/test_gaze.py"
      - "tests/test_calibration.py"
      - "tests/test_state.py"
      - "tests/test_hmm.py"
      - "config/eepy.yaml"
      - "config/state_rules.yaml"
      - "config/state_hmm.yaml"
      - "requirements-vision.txt"
      - "requirements-aus.txt"
      - ".github/workflows/camera.yml"
  workflow_dispatch:

jobs:
  vision:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: windows-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # OpenCV (pulled in by MediaPipe) needs these on a bare Ubuntu runner.
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      # The vision environment's packages (requirements-vision.txt) with the
      # same MediaPipe pin. MediaPipe brings its own OpenCV.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2" "mediapipe==0.10.14" pyyaml pytest

      # Without requirements-aus.txt: the designers' laptops. The AU tests here
      # prove that everything runs with action units switched off.
      - name: Camera, face-feature and user-state tests, rules and HMM (action units NOT installed)
        run: python -m pytest tests/test_camera.py tests/test_perception.py tests/test_aus.py tests/test_gaze.py tests/test_calibration.py tests/test_state.py tests/test_hmm.py -q

  # The optional action units, for real: Py-Feat and its model on the CPU (the
  # runners have no GPU, so CUDA and Apple's MPS are checked with bench_aus on
  # the machines themselves).
  action-units:
    name: action units (Py-Feat, CPU) / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      # CPU-only PyTorch first: the CUDA build is 2.5 GB and there is no GPU here.
      # torchcodec MUST come from the same index: PyPI's is built for CUDA 13 and
      # fails to load next to a CPU PyTorch ("libnvrtc.so.13: cannot open ...").
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchcodec --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-aus.txt pytest
      - name: numpy stayed below 2 (MediaPipe 0.10.14 needs it)
        run: python -c "import numpy; assert numpy.__version__.startswith('1.'), numpy.__version__"
      - name: Action-unit tests, with the real model
        run: python -m pytest tests/test_aus.py tests/test_perception.py -q
      - name: Benchmark (CPU numbers of a GitHub runner -- not a target)
        run: python -m eepy.perception.bench_aus --device cpu --frames 5
