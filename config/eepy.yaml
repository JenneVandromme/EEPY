# ===========================================================================
#  eepy.yaml -- settings for the whole system (not just the panel).
#  Changes take effect the next time the panel starts.
# ===========================================================================

# The experimental condition. This is what a session MEANS, so it is chosen
# when the panel starts and cannot change mid-session. It goes into the session
# folder's name and its meta.json. `python -m eepy.wizard --mode rules`
# overrides it for one run.
#
#   wizard       a human operator drives the robot through the panel
#   rules        rule-based escalation (A14)              -- not built yet
#   hmm          HMM-driven decisions                     -- not built yet
#   hmm_bandit   HMM plus a bandit choosing the action    -- not built yet
#
# In a mode that is not built yet, the panel still works by hand, shows the
# mode in amber, and records that no controller was running.
mode: wizard

# Where session folders go. data/ is gitignored: participant data must never
# be committed.
data_dir: data/sessions

# Participant IDs must look like this -- a pseudonym, never a name. The
# default allows P01 ... P999. Change it only together with the study's ID list.
participant_pattern: "^P[0-9]{2,3}$"

privacy:
  # What a participant SAYS (once speech is added) is personal data. With this
  # off, only the category of a reply is logged, never its words.
  store_raw_speech: false

logging:
  # How often buffered events and features are written to disk, in seconds.
  # A crash can lose at most this much.
  flush_seconds: 1.0

# How the robot speaks. Choose a voice by listening to them all:
#     python -m eepy.speech.voices --line refocus_check
speech:
  # piper   local neural voice: fast, offline, works on every OS (recommended)
  # system  the computer's own voice (macOS say, Windows SAPI, Linux espeak)
  # google  online, no key needed, but unofficial -- it may stop working
  # gemini  online, needs GEMINI_API_KEY in .env
  # none    never make a sound; the words only appear in the panel and the log
  engine: piper
  voice: en_US-lessac-medium
  # If the engine above fails or is missing (e.g. the Piper voice is not
  # downloaded yet), use the computer's own voice instead of staying silent.
  fallback: system
  # auto     the robot's speaker when connected to one, else this computer
  # robot    always the robot (in the simulator: this computer's speakers)
  # desktop  always this computer
  # none     no audio
  output: auto
  # Generate every fixed line in lines.yaml ahead of time, so it starts
  # instantly. Lines are regenerated automatically when lines.yaml changes.
  pregenerate: true

# The camera that feeds perception. Try your setup with:
#     python -m eepy.camera.preview
# Frames are never saved, logged or sent anywhere: only statistics are logged.
camera:
  # auto    the robot's camera with --backend real, else this laptop's camera
  # robot   always the robot's camera (needs the panel, or eepy.camera.relay)
  # laptop  always this laptop's camera
  # fake    moving test pattern, no camera needed
  source: auto
  # Frames per second handed to perception, from EITHER camera. The robot's
  # camera manages about 15, so the laptop camera is held to the same rate:
  # what perception sees in the simulator then matches the real robot.
  fps: 15
  # How often frame-rate, latency and dropped-frame statistics are logged.
  stats_seconds: 10
  # The robot's camera reaches perception over this port, on this computer
  # only (127.0.0.1). Change it only if another program already uses it.
  relay_port: 8766
  # Seconds between attempts when a camera disappears.
  reconnect_seconds: 2

  laptop:
    # Which camera: auto = the first one that works, or a number (0, 1, ...).
    # See them all with:  python -m eepy.camera.list
    index: auto
    resolution: [1280, 720]
    # How wide this webcam sees, in degrees. 78 is typical for a laptop.
    fov_deg: 78

  # What the robot sees. With the laptop camera, this sets the BLUE BOX: only
  # what is inside it goes to perception, as if the robot's camera had taken it.
  robot:
    # The robot's stream, ~720p. Also sets the blue box's shape (16:9).
    resolution: [1280, 720]
    # How wide the robot sees, in degrees: sets the blue box's width
    # (box width = laptop width x 50 / 78). 50 is the value the BURTRAM project
    # uses; the lens's own calibration says ~87, wider than most laptop cameras.
    fov_deg: 50

# Face features from the camera (eepy/perception/). What each value means:
# eepy/perception/README.md. Try changes with:  python -m eepy.camera.preview
# Thresholds marked "baseline" are relative to the person's normal face; until
# per-person calibration exists (A12), the defaults below stand in for it.
perception:
  # Window lengths for the per-second summaries (PERCLOS, blink rate, ...).
  window_seconds_short: 10
  window_seconds_long: 60
  # Below this many frames per second, blinks are too short to catch reliably:
  # blink figures are then marked low-confidence.
  min_blink_fps: 15
  # Head turned further than this from straight ahead counts as looking away.
  look_away_deg: 30

  eyes:
    ear_open: 0.28        # baseline: eye openness (EAR) of an open eye
    ear_floor: 0.05       # eye openness of a fully closed eye
    perclos_closure: 0.8  # "closed" for PERCLOS: 80 % shut (the standard P80)
  blink:
    close: 0.5            # eye 50 % shut: a blink starts
    open: 0.35            # back under 35 % shut: it ends
    min_ms: 50            # shorter is noise
    long_ms: 500          # longer counts as a LONG blink (drowsiness)
  yawn:
    jaw_open: 0.5         # how far the jaw must drop (0-1)
    mar: 0.45             # mouth opening (MAR) above the closed-mouth baseline
    min_seconds: 1.5      # held at least this long: talking does not count
    gap_seconds: 0.3      # brief dips shorter than this do not break a yawn
  nod:
    drop_deg: 12          # head drops at least this far (chin down)...
    drop_seconds: 1.5     # ...within this time...
    recover_fraction: 0.6 # ...and comes back at least 60 % of the way...
    recover_seconds: 3.0  # ...within this time: "nodding off"
    median_seconds: 5     # the head's usual position = median over this long
  face:
    lost_seconds: 1.0     # no face this long: "face lost" (left the desk, turned away)
    back_seconds: 0.5     # face seen this long again: "face back"

# Facial Action Units (AUs) with Py-Feat -- OPTIONAL: needs
#     pip install -r requirements-aus.txt     (in .venv-vision)
# Without it everything else runs; AUs are simply off. What each AU means, how
# to install per OS and how to pick a profile: eepy/perception/aus/README.md. Which PROFILE applies: --profile,
# else EEPY_PROFILE in your own .env (e.g. EEPY_PROFILE=demo-desktop), else laptop.
aus:
  # The AUs EEPY uses. Py-Feat offers AU01 02 04 05 06 07 09 10 11 12 14 15 17 20
  # 23 24 25 26 28 43.
  units: [AU01, AU02, AU04, AU05, AU07, AU25, AU26, AU43]
  active_threshold: 0.5   # an AU counts as "on" from this probability
  stale_seconds: 1.0      # a result older than this (vs. the newest frame) is stale: not used
  min_rate: 2             # fewer results per second than this is too slow to be useful...
  slow_grace_seconds: 10  # ...for this long: AUs pause (and say so)...
  retry_seconds: 60       # ...and try again after this long
  profiles:
    laptop:               # teammates' laptops and development
      enabled: auto       # auto: on if installed | true: expected (warns if missing) | false: off
      device: auto        # auto (cuda > mps > cpu) | cuda | mps | cpu
      max_rate: 10        # at most this many AU results per second
      require_gpu: false
      cpu_threads: auto   # auto, or a number: PyTorch threads when running on the CPU
    demo-desktop:         # the lab / demo desktop with an NVIDIA GPU
      enabled: true
      device: auto
      max_rate: 15        # the camera's rate
      require_gpu: true   # no GPU found: a LOUD warning (AUs keep running, slower)
      cpu_threads: auto

# Where the person is looking: at their work (screen, notes) or away.
# eepy/perception/gaze/README.md explains every value. The work area is
# PERSONAL -- calibrate it per person and camera setup:
#     python -m eepy.perception.calibrate_gaze
# Without calibration the defaults below are used (and flagged "uncalibrated").
gaze:
  min_away_seconds: 1.0     # looking off-work this long counts as "looked away"...
  min_back_seconds: 0.5     # ...and back on work this long as "back on work"
  smoothing_seconds: 0.15   # evens out jitter in the gaze direction
  # How far the eyes turn (degrees) when the iris sits fully at the corner.
  eye_gain_yaw: 35
  eye_gain_pitch: 25
  # The iris is only trusted when the eyes are this many pixels wide, the head
  # is turned less than this, both eyes agree and the iris is steady;
  # otherwise the head direction alone is used ("head only" mode).
  min_eye_width_px: 18
  max_head_yaw_for_iris: 40
  max_eye_disagreement: 0.6
  max_iris_jitter_deg: 6
  edge_softness_deg: 3      # how gradually "on work" fades near a zone's edge
  screen_margin_deg: 4      # calibrated zones are this much bigger than the points
  notes_margin_deg: 8
  # "look_at: user" follows the real student: where their face is in the robot's
  # view is sent to the panel this many times a second. The robot camera's lens
  # sees this wide (degrees); with the laptop camera the blue box is the view.
  robot_lens_fov_deg: 87
  user_report_rate: 5
  # Uncalibrated: degrees (yaw + = the person's left, pitch + = down).
  default_screen: {yaw: 20, pitch_min: -10, pitch_max: 20}
  default_notes:  {yaw: 30, pitch_min: 20, pitch_max: 45}
