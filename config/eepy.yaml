# ===========================================================================
#  eepy.yaml -- settings for the whole system (not just the panel).
#  Changes take effect the next time the panel starts.
# ===========================================================================

# The experimental condition. This is what a session MEANS, so it is chosen
# when the panel starts and cannot change mid-session. It goes into the session
# folder's name and its meta.json. `python -m eepy.wizard --mode rules`
# overrides it for one run.
#
#   wizard       a human operator drives the robot through the panel
#   rules        rule-based escalation (A14)              -- not built yet
#   hmm          HMM-driven decisions                     -- not built yet
#   hmm_bandit   HMM plus a bandit choosing the action    -- not built yet
#
# In a mode that is not built yet, the panel still works by hand, shows the
# mode in amber, and records that no controller was running.
mode: wizard

# Where session folders go. data/ is gitignored: participant data must never
# be committed.
data_dir: data/sessions

# Participant IDs must look like this -- a pseudonym, never a name. The
# default allows P01 ... P999. Change it only together with the study's ID list.
participant_pattern: "^P[0-9]{2,3}$"

privacy:
  # What a participant SAYS (once speech is added) is personal data. With this
  # off, only the category of a reply is logged, never its words.
  store_raw_speech: false

logging:
  # How often buffered events and features are written to disk, in seconds.
  # A crash can lose at most this much.
  flush_seconds: 1.0

# How the robot speaks. Choose a voice by listening to them all:
#     python -m eepy.speech.voices --line refocus_check
speech:
  # piper   local neural voice: fast, offline, works on every OS (recommended)
  # system  the computer's own voice (macOS say, Windows SAPI, Linux espeak)
  # google  online, no key needed, but unofficial -- it may stop working
  # gemini  online, needs GEMINI_API_KEY in .env
  # none    never make a sound; the words only appear in the panel and the log
  engine: piper
  voice: en_US-lessac-medium
  # If the engine above fails or is missing (e.g. the Piper voice is not
  # downloaded yet), use the computer's own voice instead of staying silent.
  fallback: system
  # auto     the robot's speaker when connected to one, else this computer
  # robot    always the robot (in the simulator: this computer's speakers)
  # desktop  always this computer
  # none     no audio
  output: auto
  # Generate every fixed line in lines.yaml ahead of time, so it starts
  # instantly. Lines are regenerated automatically when lines.yaml changes.
  pregenerate: true

# The camera that feeds perception. Try your setup with:
#     python -m eepy.camera.preview
# Frames are never saved, logged or sent anywhere: only statistics are logged.
camera:
  # auto    the robot's camera with --backend real, else this laptop's camera
  # robot   always the robot's camera (needs the panel, or eepy.camera.relay)
  # laptop  always this laptop's camera
  # fake    moving test pattern, no camera needed
  source: auto
  # Frames per second handed to perception, from EITHER camera. The robot's
  # camera manages about 15, so the laptop camera is held to the same rate:
  # what perception sees in the simulator then matches the real robot.
  fps: 15
  # How often frame-rate, latency and dropped-frame statistics are logged.
  stats_seconds: 10
  # The robot's camera reaches perception over this port, on this computer
  # only (127.0.0.1). Change it only if another program already uses it.
  relay_port: 8766
  # Seconds between attempts when a camera disappears.
  reconnect_seconds: 2

  laptop:
    # Which camera: auto = the first one that works, or a number (0, 1, ...).
    # See them all with:  python -m eepy.camera.list
    index: auto
    resolution: [1280, 720]
    # How wide this webcam sees, in degrees. 78 is typical for a laptop.
    fov_deg: 78

  # What the robot sees. With the laptop camera, this sets the BLUE BOX: only
  # what is inside it goes to perception, as if the robot's camera had taken it.
  robot:
    # The robot's stream, ~720p. Also sets the blue box's shape (16:9).
    resolution: [1280, 720]
    # How wide the robot sees, in degrees: sets the blue box's width
    # (box width = laptop width x 50 / 78). 50 is the value the BURTRAM project
    # uses; the lens's own calibration says ~87, wider than most laptop cameras.
    fov_deg: 50
