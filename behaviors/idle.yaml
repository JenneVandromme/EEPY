# ===========================================================================
#  idle.yaml -- what EEPY does when nothing in particular is happening.
#
#  These are NOT on a ladder. The decision logic plays them as background
#  presence, not as nudges, so they have no "ladder" or "level" field.
#
#  After editing run:  python -m eepy.behaviors.validate
# ===========================================================================
behaviors:

  - name: study_buddy_idle
    group: idle
    description: >
      Quiet company. Only a slow breathing motion. Must be boring to watch --
      if you notice it, it is too big.
    # No glance down at the notes any more (2026-10-15): the camera sits in the
    # head, so every glance tipped it 20 degrees down, the face left the picture
    # and perception read the student as looking away (or absent).
    loop: forever          # runs until the player stops it
    intensity: 0.7         # deliberately under 1.0: calmer than written
    keyframes:
      - use: breathe_in
      - use: breathe_out

  - name: approving_nod
    group: idle
    description: >
      "Good, keep going." Played when the student gets back to work on their
      own, so the robot is not only ever the one interrupting.
    loop: once
    keyframes:
      - use: glance_at_user
      - use: nod_slow
      - use: antenna_perk
      - use: return_to_neutral
