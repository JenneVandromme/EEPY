# ===========================================================================
#  lines.yaml -- everything EEPY can say out loud.
#
#  Behaviours never contain words. They reference a line by its ID
#  ("say: refocus_check"), and the words live here. That way you can rewrite
#  what the robot says without touching any movement.
#
#  Every line has two tones:
#
#    hedged  -- used when the system is NOT confident. Softer, phrased as a
#               guess, easy to brush off. "Losing focus a bit?"
#    direct  -- used when the system IS confident. Shorter, more certain.
#               "Back to it?"
#
#  Each tone holds a LIST of variants. One is picked at random each time, so
#  the robot does not say the identical sentence twice in a row.
#
#  IMPORTANT -- always put the words in "quotes". Without quotes, YAML turns
#  a line like  no  into the value false, and a line containing a colon
#  breaks the file outright.
#
#  Placeholders in {curly braces} get filled in by the player later:
#    {minutes}  -- a number of minutes, e.g. "40"
#    {evidence} -- a short phrase explaining why the robot spoke up,
#                  e.g. "you've been still for a while"
#  Only those two are allowed; the validator rejects anything else, so a typo
#  like {minute} is caught before it ever reaches the robot.
#
#  After editing run:  python -m eepy.behaviors.validate
# ===========================================================================
lines:

  refocus_check:
    description: Level 3 of the refocus ladder -- the first spoken nudge.
    variants:
      hedged:
        - "Losing focus a bit?"
        - "Still with it?"
        - "Hmm, drifting?"
      direct:
        - "Back to it?"
        - "Shall we get back to it?"

  refocus_break_offer:
    description: Level 4 of the refocus ladder -- stop pushing, offer a break.
    variants:
      hedged:
        - "Maybe a short break would help?"
        - "Want to pause for a bit?"
      direct:
        - "Let's take five."
        - "Time for a break. Come back in {minutes} minutes?"

  bedtime_check:
    description: Level 3 of the bedtime ladder -- first spoken bedtime nudge.
    variants:
      hedged:
        - "Getting late, isn't it?"
        - "You must be getting tired."
      direct:
        - "Time for bed?"
        - "You've been at this {minutes} minutes. Bed?"

  bedtime_negotiate:
    description: >
      Level 4 of the bedtime ladder -- offer a wind-down timer rather than
      repeating the same nudge.
    variants:
      hedged:
        - "Shall we wind down in {minutes} minutes?"
        - "How about we stop in a little while?"
      direct:
        - "Let's finish in {minutes} minutes. Deal?"
        - "Last {minutes} minutes, then bed."

  bedtime_goodnight:
    description: Level 5 of the bedtime ladder -- said just before sleeping.
    variants:
      hedged:
        - "I think I'm going to sleep. Night."
        - "I'm fading. Goodnight?"
      direct:
        - "Goodnight."
        - "Sleep well."

  approving:
    description: >
      Optional words for the approving nod. Not currently referenced by any
      behaviour -- kept here so a designer can wire it up without writing
      new text.
    variants:
      hedged:
        - "Nice."
        - "That's it."
      direct:
        - "Good going."
        - "{evidence} -- nice work."

  break_welcome_back:
    description: >
      Said when the participant comes back after taking the break the robot
      offered (refocus level 4). PLACEHOLDER TEXT: rewrite freely.
    variants:
      hedged:
        - "Welcome back."
        - "Oh, you're back. Ready to go on?"
      direct:
        - "Welcome back. Let's go on."
        - "Back again. Shall we?"

  wind_down_reminder:
    description: >
      Said shortly before the wind-down timer ends (bedtime level 4 agreed
      "{minutes} more minutes"). PLACEHOLDER TEXT: rewrite freely.
    variants:
      hedged:
        - "Almost time to stop, {minutes} more minute."
        - "Nearly done? We said we'd stop soon."
      direct:
        - "One more minute, then bed."
        - "Time's nearly up."

  # --- calibration (A12) ------------------------------------------------------
  # Spoken during the calibration at the start of a session (the face check,
  # the gaze dots, one minute of normal work). PLACEHOLDER TEXT: rewrite freely.
  # Lines whose ID starts with "calibration_" are said by the calibration
  # itself, so the Wizard panel shows no buttons for them. Hedged and direct are
  # the same here: the calibration is not a nudge.

  calibration_intro:
    description: Start of the calibration -- what is about to happen.
    variants:
      hedged: ["Let's get to know your face for a moment. It takes about two minutes."]
      direct: ["Let's get to know your face for a moment. It takes about two minutes."]

  calibration_face_check:
    description: The face check -- sit so the camera sees you well.
    variants:
      hedged: ["First, sit the way you normally work, facing the screen."]
      direct: ["First, sit the way you normally work, facing the screen."]

  calibration_face_not_found:
    description: The face check cannot find a face.
    variants:
      hedged: ["I can't see your face yet. Could you sit in front of the camera?"]
      direct: ["I can't see your face yet. Could you sit in front of the camera?"]

  calibration_face_outside_box:
    description: Part of the face is outside the view (laptop camera - the blue rectangle).
    variants:
      hedged: ["Could you move a little, so your whole face is in view?"]
      direct: ["Could you move a little, so your whole face is in view?"]

  calibration_too_dark:
    description: The face is too dark for the camera.
    variants:
      hedged: ["It's a bit dark. Could you turn on a light?"]
      direct: ["It's a bit dark. Could you turn on a light?"]

  calibration_too_bright:
    description: The face is washed out by strong light.
    variants:
      hedged: ["There's a lot of light on your face. Could you move out of it a bit?"]
      direct: ["There's a lot of light on your face. Could you move out of it a bit?"]

  calibration_too_far:
    description: The person sits too far from the camera.
    variants:
      hedged: ["Could you come a little closer?"]
      direct: ["Could you come a little closer?"]

  calibration_look_dot:
    description: Gaze calibration -- look at the dots on the screen.
    variants:
      hedged: ["Now look at each dot on the screen until it turns green."]
      direct: ["Now look at each dot on the screen until it turns green."]

  calibration_look_notes:
    description: Gaze calibration -- look at the notes on the desk.
    variants:
      hedged: ["Now look at your notes, until you hear a beep."]
      direct: ["Now look at your notes, until you hear a beep."]

  calibration_look_away:
    description: Gaze calibration -- look away to the side.
    variants:
      hedged: ["And now look away to the side, until the beep."]
      direct: ["And now look away to the side, until the beep."]

  calibration_baseline_start:
    description: The baseline -- about a minute of normal work.
    variants:
      hedged: ["Great. Now just work as usual for about a minute."]
      direct: ["Great. Now just work as usual for about a minute."]

  calibration_baseline_extend:
    description: The baseline needs a little longer (face out of view, looked away a lot...).
    variants:
      hedged: ["Just a little longer, please keep working as usual."]
      direct: ["Just a little longer, please keep working as usual."]

  calibration_done:
    description: The calibration succeeded.
    variants:
      hedged: ["All set. Thank you!"]
      direct: ["All set. Thank you!"]

  calibration_failed:
    description: The calibration did not succeed (the panel/terminal says why).
    variants:
      hedged: ["Hmm, that didn't quite work. Let's try that again in a moment."]
      direct: ["Hmm, that didn't quite work. Let's try that again in a moment."]
